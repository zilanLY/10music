[build]
  command = "node scripts/build-netlify.js && rm -f package-lock.json && rm -rf node_modules && npm install && npm run build:web"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# API 路由 — 代理到 Netlify Function
# 使用 200 状态码表示重写（rewrite），而不是重定向（redirect）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA 回退
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
