[build]
  command = "node scripts/build-netlify.js && node scripts/build-netlify-modules.js && rm -f package-lock.json && rm -rf node_modules && npm install && npm run build:web"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@unblockneteasemusic/server"]

# API 路由 — 代理到 Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA 回退
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
