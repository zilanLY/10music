[build]
  command = "node scripts/build-netlify.js && rm -f package-lock.json && rm -rf node_modules && npm install && npm run build:web"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 关键：强制把 ncm-api 目录包含进 Function bundle
# 这样 api.js 里的 fs.readdirSync(__dirname + '/ncm-api/module') 才能正常读取
[functions.api]
  included_files = ["netlify/functions/ncm-api/**"]

# API 路由 — 代理到 Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA 回退
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
