# Cloudflare Pages 配置
# 使用 Pages Functions (functions/api/[[path]].ts) 实现前端 + API 一体化部署

name = "10music"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Pages 构建配置
[site]
bucket = "./dist"

# KV 缓存命名空间（可选，用于 API 响应缓存）
# 需要先创建: npx wrangler kv:namespace create "MUSIC_CACHE"
# [[kv_namespaces]]
# binding = "MUSIC_CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
